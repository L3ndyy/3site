<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Объявление — БазарПро</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-40 glass border-b border-slate-200/80 dark:border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 shrink-0">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-md">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                </div>
                <span class="text-2xl font-black text-slate-900 dark:text-white">Базар<span class="text-indigo-600 dark:text-indigo-400">Про</span></span>
            </a>

            <div class="flex items-center gap-3">
                <button onclick="App.toggleTheme()" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="sun-moon" class="w-5 h-5"></i>
                </button>
                <div id="header-auth-container"></div>
                <a href="create-ad.html" class="hidden sm:flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i> Подать объявление
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Хлебные крошки -->
        <nav class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mb-6">
            <a href="index.html" class="hover:text-indigo-600">Главная</a>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            <a href="catalog.html" class="hover:text-indigo-600">Каталог</a>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            <span id="breadcrumb-title" class="text-slate-900 dark:text-white font-semibold truncate max-w-xs">Загрузка...</span>
        </nav>

        <div id="ad-details-layout" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Контент объявления подгружается через JS -->
        </div>

        <!-- Секция Похожие объявления -->
        <section class="mt-16 pt-10 border-t border-slate-200 dark:border-slate-800">
            <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white mb-6">Похожие объявления</h2>
            <div id="similar-ads-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Карточки -->
            </div>
        </section>
    </main>

    <!-- Подвал -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8 mt-16 text-center text-xs text-slate-400">
        © 2026 БазарПро. Доска объявлений (Вариант 10).
    </footer>

    <!-- Модальные окна -->
    <div id="chat-modal" class="modal-overlay"></div>
    <div id="quick-view-modal" class="modal-overlay"></div>

    <script src="js/mock-data.js"></script>
    <script src="js/masks.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ads.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>

    <script>
        let currentAd = null;
        let isPhoneRevealed = false;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const adId = params.get('id') || 'ad_001';

            currentAd = await DB.getAdById(adId);
            if (!currentAd) {
                document.getElementById('ad-details-layout').innerHTML = `
                    <div class="col-span-3 card-premium p-12 text-center">
                        <h2 class="text-2xl font-bold mb-2">Объявление не найдено</h2>
                        <p class="text-sm text-slate-500 mb-6">Возможно оно было снято с публикации или удалено.</p>
                        <a href="catalog.html" class="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold">Вернуться в каталог</a>
                    </div>
                `;
                return;
            }

            // Увеличиваем просмотры
            await DB.incrementViews(currentAd.id);

            document.title = `${currentAd.title} — БазарПро`;
            document.getElementById('breadcrumb-title').innerText = currentAd.title;

            renderAdDetails(currentAd);
            renderSimilarAds(currentAd);
        });

        function renderAdDetails(ad) {
            const container = document.getElementById('ad-details-layout');
            const currentUser = Auth.getCurrentUser();
            const userFavs = currentUser ? DB.getFavorites(currentUser.id) : [];
            const isFav = userFavs.includes(ad.id);
            const photos = ad.photos && ad.photos.length > 0 ? ad.photos : ['https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=800&q=80'];

            const maskedPhone = ad.userPhone ? ad.userPhone.substring(0, 8) + ' •••-••-' + ad.userPhone.slice(-2) : '+7 (999) •••-••-00';

            container.innerHTML = `
            <!-- Левая колонка: Галерея и Описание -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Галерея фото -->
                <div class="card-premium p-4 space-y-4">
                    <div class="relative w-full h-[420px] rounded-2xl overflow-hidden bg-slate-900 flex items-center justify-center">
                        <img id="main-ad-image" src="${photos[0]}" alt="${ad.title}" class="w-full h-full object-contain">
                        ${ad.isVip ? '<span class="vip-badge absolute top-4 left-4">VIP ПРЕДЛОЖЕНИЕ</span>' : ''}
                    </div>

                    ${photos.length > 1 ? `
                    <div class="flex items-center gap-3 overflow-x-auto pb-2">
                        ${photos.map((p, idx) => `
                            <button onclick="setMainImage('${p}', this)" class="thumbnail-btn w-20 h-20 rounded-xl overflow-hidden border-2 shrink-0 ${idx === 0 ? 'border-indigo-600' : 'border-transparent opacity-70 hover:opacity-100'} transition-all">
                                <img src="${p}" class="w-full h-full object-cover">
                            </button>
                        `).join('')}
                    </div>` : ''}
                </div>

                <!-- Описание и детали -->
                <div class="card-premium p-6 sm:p-8 space-y-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4">Описание</h2>
                        <div class="text-slate-700 dark:text-slate-300 text-sm leading-relaxed whitespace-pre-line">${ad.description}</div>
                    </div>

                    <div class="pt-6 border-t border-slate-100 dark:border-slate-800">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Характеристики</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                            <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                <span class="text-slate-400">Категория:</span>
                                <span class="font-semibold text-slate-800 dark:text-slate-200">${ad.categoryName || 'Общая'}</span>
                            </div>
                            <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                <span class="text-slate-400">Состояние:</span>
                                <span class="font-semibold text-slate-800 dark:text-slate-200">${ad.conditionName || ad.condition || 'Отличное'}</span>
                            </div>
                            <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                <span class="text-slate-400">Город:</span>
                                <span class="font-semibold text-slate-800 dark:text-slate-200">${ad.city}</span>
                            </div>
                            <div class="flex justify-between py-2 border-b border-slate-100 dark:border-slate-800">
                                <span class="text-slate-400">Адрес:</span>
                                <span class="font-semibold text-slate-800 dark:text-slate-200">${ad.address || 'Центр города'}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Локация на карте -->
                    <div class="pt-6 border-t border-slate-100 dark:border-slate-800">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-3 flex items-center gap-2">
                            <i data-lucide="map-pin" class="w-5 h-5 text-indigo-600"></i> Местоположение
                        </h3>
                        <p class="text-xs text-slate-500 mb-3">${ad.city}, ${ad.address || 'Адрес уточняйте у продавца'}</p>
                        <div class="h-48 rounded-2xl bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-400 font-semibold text-sm relative overflow-hidden">
                            <div class="absolute inset-0 bg-[radial-gradient(#6366f1_1px,transparent_1px)] [background-size:16px_16px] opacity-30"></div>
                            <div class="z-10 flex flex-col items-center gap-2">
                                <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center animate-bounce shadow-lg">
                                    <i data-lucide="map-pin" class="w-5 h-5"></i>
                                </div>
                                <span class="text-xs text-slate-600 dark:text-slate-300 font-bold bg-white/80 dark:bg-slate-900/80 px-3 py-1 rounded-full shadow">${ad.city}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: Цена, Контакты продавца -->
            <div class="space-y-6">
                <!-- Карточка цены и действий -->
                <div class="card-premium p-6 space-y-6 sticky top-28">
                    <div>
                        <div class="text-3xl sm:text-4xl font-black text-slate-900 dark:text-white tracking-tight">
                            ${Masks.formatPrice(ad.price, ad.priceNegotiable)}
                        </div>
                        ${ad.priceNegotiable ? '<span class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 mt-1 block">✓ Возможен обоснованный торг</span>' : ''}
                    </div>

                    <div class="space-y-3">
                        <!-- Кнопка Показать телефон с маской -->
                        <button id="phone-btn" onclick="revealPhone()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-3 transition-all">
                            <i data-lucide="phone" class="w-5 h-5"></i>
                            <span id="phone-text">${maskedPhone}</span>
                        </button>

                        <!-- Кнопка Написать продавцу -->
                        <button onclick="Chat.openChat('${ad.id}', '${ad.userId}', '${ad.userName}', '${ad.title.replace(/'/g, "\\'")}')" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-3 transition-all">
                            <i data-lucide="message-circle" class="w-5 h-5"></i>
                            <span>Написать продавцу</span>
                        </button>

                        <!-- Избранное и Поделиться -->
                        <div class="grid grid-cols-2 gap-2 pt-2">
                            <button onclick="Ads.toggleFavorite('${ad.id}')" class="py-2.5 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : ''}"></i> В избранное
                            </button>
                            <button onclick="copyShareLink()" class="py-2.5 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="share-2" class="w-4 h-4"></i> Поделиться
                            </button>
                        </div>
                    </div>

                    <!-- Карточка продавца -->
                    <div class="pt-6 border-t border-slate-100 dark:border-slate-800">
                        <div class="flex items-center gap-4 mb-4">
                            <img src="${ad.userAvatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80'}" class="w-14 h-14 rounded-2xl object-cover border border-slate-200 dark:border-slate-700">
                            <div>
                                <h4 class="font-bold text-base text-slate-900 dark:text-white">${ad.userName || 'Частное лицо'}</h4>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    <div class="flex text-amber-400">
                                        <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400"></i>
                                    </div>
                                    <span class="text-xs font-bold text-slate-700 dark:text-slate-300">${ad.userRating || '5.0'}</span>
                                    <span class="text-xs text-slate-400">(${ad.reviewsCount || 12} отзывов)</span>
                                </div>
                                <span class="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold flex items-center gap-1 mt-1">
                                    <i data-lucide="check-circle-2" class="w-3 h-3"></i> Документы проверены
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Безопасность -->
                    <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/60 text-xs text-amber-800 dark:text-amber-300 flex items-start gap-3">
                        <i data-lucide="shield-alert" class="w-5 h-5 shrink-0 text-amber-600 mt-0.5"></i>
                        <div>
                            <span class="font-bold block mb-0.5">Безопасная сделка:</span>
                            Не отправляйте предоплату незнакомым продавцам до личной встречи и проверки товара.
                        </div>
                    </div>
                </div>
            </div>`;

            if (window.lucide) lucide.createIcons();
        }

        function setMainImage(src, btn) {
            const mainImg = document.getElementById('main-ad-image');
            if (mainImg) mainImg.src = src;

            document.querySelectorAll('.thumbnail-btn').forEach(b => {
                b.classList.remove('border-indigo-600');
                b.classList.add('border-transparent', 'opacity-70');
            });
            btn.classList.remove('border-transparent', 'opacity-70');
            btn.classList.add('border-indigo-600');
        }

        function revealPhone() {
            if (!currentAd) return;
            const phoneText = document.getElementById('phone-text');
            const phoneBtn = document.getElementById('phone-btn');
            
            if (phoneText && currentAd.userPhone) {
                phoneText.innerText = currentAd.userPhone;
                phoneBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                phoneBtn.classList.add('bg-slate-900', 'hover:bg-black');
                App.showToast('Номер телефона открыт!', 'success');
                DB.addLog(currentAd.userEmail || 'Покупатель', 'VIEW_PHONE', `Просмотр контактов продавца по объявлению "${currentAd.title}"`);
            }
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            App.showToast('Ссылка на объявление скопирована в буфер обмена!', 'success');
        }

        async function renderSimilarAds(ad) {
            const container = document.getElementById('similar-ads-grid');
            if (!container) return;

            const allAds = await DB.getAds({ categoryId: ad.categoryId, status: 'active' });
            const similar = allAds.filter(a => String(a.id) !== String(ad.id)).slice(0, 4);

            if (similar.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 col-span-4">Похожих объявлений в этой категории пока нет</p>';
                return;
            }

            const currentUser = Auth.getCurrentUser();
            container.innerHTML = similar.map(s => Ads.renderCard(s, currentUser ? currentUser.id : null)).join('');
            if (window.lucide) lucide.createIcons();
        }
    </script>
</body>
</html>
