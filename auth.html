<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация — БазарПро</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="glass border-b border-slate-200/80 dark:border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-md">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                </div>
                <span class="text-2xl font-black text-slate-900 dark:text-white">Базар<span class="text-indigo-600 dark:text-indigo-400">Про</span></span>
            </a>

            <button onclick="App.toggleTheme()" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                <i data-lucide="sun-moon" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Auth Card -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
        <div class="card-premium p-6 sm:p-10 w-full max-w-md animate-scale-in">
            
            <!-- Табы: Вход / Регистрация -->
            <div class="grid grid-cols-2 p-1 bg-slate-100 dark:bg-slate-900 rounded-2xl mb-8">
                <button id="auth-tab-login" onclick="setAuthTab('login')" class="py-2.5 text-xs font-bold rounded-xl bg-white dark:bg-slate-800 shadow-sm text-indigo-600 dark:text-white transition-all">
                    Вход в аккаунт
                </button>
                <button id="auth-tab-register" onclick="setAuthTab('register')" class="py-2.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">
                    Регистрация
                </button>
            </div>

            <!-- ФОРМА ВХОДА -->
            <form id="login-form" class="space-y-4" onsubmit="handleLoginSubmit(event)">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Email адрес</label>
                    <div class="relative">
                        <input type="email" id="login-email" placeholder="name@example.com" required class="input-field pl-10 text-sm">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">Пароль</label>
                        <a href="#" onclick="alert('Для демо используйте: admin@bazarpro.ru / admin123 или seller.alex@gmail.com / user123')" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline">Забыли пароль?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="login-password" placeholder="••••••••" required class="input-field pl-10 text-sm">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i> Войти в сервис
                </button>
            </form>

            <!-- ФОРМА РЕГИСТРАЦИИ (С МАСКАМИ ВВОДА) -->
            <form id="register-form" class="space-y-4 hidden" onsubmit="handleRegisterSubmit(event)">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Ваше Имя и Фамилия <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <input type="text" id="reg-name" placeholder="Иван Иванов" required minlength="2" class="input-field pl-10 text-sm">
                        <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Номер телефона <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <input type="tel" id="reg-phone" placeholder="+7 (___) ___-__-__" data-mask="phone" required class="input-field pl-10 font-mono text-sm">
                        <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                    </div>
                    <span class="text-[11px] text-slate-400 mt-0.5 block">Номер будет скрыт маской от спамеров</span>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Email адрес <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <input type="email" id="reg-email" placeholder="name@domain.ru" required class="input-field pl-10 text-sm">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Пароль <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <input type="password" id="reg-password" placeholder="Минимум 6 знаков" required minlength="6" class="input-field pl-10 text-sm" oninput="handlePasswordChange()">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                    </div>
                    
                    <!-- Индикатор надежности пароля -->
                    <div class="strength-meter mt-2">
                        <div id="password-strength-bar" class="strength-bar"></div>
                    </div>
                    <div id="password-strength-label" class="text-[11px] text-slate-400 mt-1">Введите пароль</div>
                </div>

                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" id="reg-agree" required class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 mt-0.5">
                    <label for="reg-agree" class="text-xs text-slate-500">Я принимаю <a href="about.html#safety" class="text-indigo-600 underline">правила сервиса</a> и согласен на обработку персональных данных</label>
                </div>

                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/25 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> Зарегистрироваться
                </button>
            </form>

            <!-- Быстрый демо-вход для проверки преподавателем -->
            <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 space-y-3">
                <div class="text-xs font-bold uppercase tracking-wider text-slate-400 text-center">Демо-доступ в один клик:</div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="quickLogin('admin')" class="p-2.5 rounded-xl border border-purple-200 dark:border-purple-900 bg-purple-50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300 text-xs font-bold hover:bg-purple-100 transition-colors flex items-center justify-center gap-1.5">
                        <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Админ
                    </button>
                    <button type="button" onclick="quickLogin('user')" class="p-2.5 rounded-xl border border-indigo-200 dark:border-indigo-900 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 text-xs font-bold hover:bg-indigo-100 transition-colors flex items-center justify-center gap-1.5">
                        <i data-lucide="user" class="w-3.5 h-3.5"></i> Продавец
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-400">
        © 2026 БазарПро. Доска объявлений (Вариант 10).
    </footer>

    <script src="js/mock-data.js"></script>
    <script src="js/masks.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ads.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>

    <script>
        function setAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginTab = document.getElementById('auth-tab-login');
            const registerTab = document.getElementById('auth-tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.className = 'py-2.5 text-xs font-bold rounded-xl bg-white dark:bg-slate-800 shadow-sm text-indigo-600 dark:text-white transition-all';
                registerTab.className = 'py-2.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTab.className = 'py-2.5 text-xs font-bold rounded-xl bg-white dark:bg-slate-800 shadow-sm text-indigo-600 dark:text-white transition-all';
                loginTab.className = 'py-2.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
            }
        }

        function handlePasswordChange() {
            const pwd = document.getElementById('reg-password').value;
            const bar = document.getElementById('password-strength-bar');
            const label = document.getElementById('password-strength-label');
            const info = Masks.checkPasswordStrength(pwd);

            bar.className = `strength-bar strength-${info.grade}`;
            label.innerText = info.label;
            label.className = `text-[11px] mt-1 ${info.color}`;
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;

            const res = Auth.login(email, pass);
            if (res.success) {
                App.showToast(res.message, 'success');
                setTimeout(() => {
                    if (res.user.role === 'admin') window.location.href = 'admin.html';
                    else window.location.href = 'profile.html';
                }, 800);
            } else {
                App.showToast(res.message, 'error');
            }
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const fullName = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const res = Auth.register({ fullName, phone, email, password });
            if (res.success) {
                App.showToast(res.message, 'success');
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1000);
            } else {
                App.showToast(res.message, 'error');
            }
        }

        function quickLogin(role) {
            if (role === 'admin') {
                document.getElementById('login-email').value = 'admin@bazarpro.ru';
                document.getElementById('login-password').value = 'admin123';
            } else {
                document.getElementById('login-email').value = 'seller.alex@gmail.com';
                document.getElementById('login-password').value = 'user123';
            }
            setAuthTab('login');
            handleLoginSubmit(new Event('submit'));
        }
    </script>
</body>
</html>
